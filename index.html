<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Alisha Collection</title>

<style>

body{
margin:0;
font-family:Arial;
background:#faf8f5;
}

header{
background:#c8a97e;
padding:20px;
text-align:center;
color:white;
}

.logo{
width:120px;
border-radius:50%;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.buy-btn{
display:block;
background:#c8a97e;
color:white;
text-decoration:none;
padding:10px;
text-align:center;
border-radius:8px;
margin-top:10px;
}

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header>

<img src="logo.jpg" class="logo">

<h1>ALISHA COLLECTION</h1>

<p>Exclusive Designs for Every Person</p>

</header>

<div class="products" id="products"></div>

<footer>

WhatsApp: 01410717923

</footer>

<script type="module" src="app.js"></script>

</body>
</html>
